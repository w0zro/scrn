# Pushing a v* tag runs the tests and hands the build to goreleaser, which
# produces what install.sh expects — conn_<version>_<os>_<arch>.tar.gz with
# the manpage inside, beside a checksums.txt — plus the changelog. The
# artifact names are .goreleaser.yaml's contract; rehearse changes to it with
# `goreleaser release --snapshot --clean`.
#
# The tests run on macOS because that is where conn is developed; the push
# workflow has already run them on Linux by the time any tag is cut.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
