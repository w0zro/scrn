# The tests, on every push and pull request.
#
# The release workflow runs them too, but only once a tag is pushed — which is
# the worst moment to learn of a break, because the tag is already cut. This is
# the same check, run while it is still cheap to act on.
#
# macOS is where conn is developed; Linux is where the cross-compiled builds
# were shipped untested until this leg existed. Both read the process list
# through lsof and hold their shells in a real tmux, so both runs mean what
# they say.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Neighbors (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux lsof

      - name: Neighbors (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || {
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
