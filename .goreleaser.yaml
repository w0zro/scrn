# goreleaser builds the release install.sh downloads from. The names are the
# contract: conn_<version>_<os>_<arch>.tar.gz holding conn and its manpage,
# beside a checksums.txt — exactly what the hand-rolled workflow produced,
# now with the changelog and the rest for free. `goreleaser release
# --snapshot --clean` rehearses the whole thing locally.
version: 2

project_name: conn

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "conn_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: man/conn.1
        dst: conn.1

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
